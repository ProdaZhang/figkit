name: tests

# 唯一入口 = tools/run_all_tests.py(spec parity + 七套纯标准库测试,不是 pytest)。
# 这里不再抄一份 shell 循环 —— 文档、CI、本地跑的是同一个脚本,才不会各说各话。
#
# 平台矩阵的理由:本仓在 Windows 上开发,而 CI 曾经只跑 ubuntu —— 主力平台反倒没人守。
# 三平台都跑,顺带盯住路径分隔符、换行、编码这类只在某一边现形的问题。
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.x"]
        include:
          # 版本下限只在一个平台上守,够用且省额度。改下限记得同步 CONTRIBUTING。
          - os: ubuntu-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tools/run_all_tests.py

  # cocos 的 TS 类型门。单开一个 job,因为它是全仓**唯一**要联网装依赖的检查 ——
  # 上面那套是纯标准库、离线、跑在三个平台上,不该为它拖上一整套 node 工具链。
  #
  # 这道门此前只存在于作者本机:README / SKILL.md / mapping.md 三处都写着"已过严格类型门、
  # 故意错用 API 会被抓",而仓库里没有 tsconfig、没有 package.json,CI 也不跑 ——
  # clone 下来的人复现不了。**不可复现的声明,读者没法和假声明区分开。**
  cocos-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/cocos-typecheck/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci
        working-directory: tools/cocos-typecheck
      # check.py 跑两条:零错,**以及**种一个必然的类型错误后 tsc 必须报出来。
      # 只跑前者证明不了门有牙 —— tsconfig 写歪时它同样是绿的。
      - run: python check.py
        working-directory: tools/cocos-typecheck

  # figma2html 的运行时在真浏览器里的行为冒烟。windows runner 自带 Edge,不装任何依赖
  # (断言的是 driver 量回来的**数**,不是像素,所以连 Pillow 都不需要)。
  #
  # 它补的是一个真空:assemble.js / render.js 是六个后端里唯一实跑过的参照实现,另外五家
  # 都照着它写 —— 而它自己一条自动化测试都没有。转场位移基准漂了、抖动波形与三个引擎
  # 不同形,都是在这个洞里活下来的。
  html-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/html-smoke/check.py
